name: Feature request
description: Suggest a rendering feature, a theme option, or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: A Markdown feature, a theme setting, an export option, a UI improvement…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What workflow does this unblock for you?
